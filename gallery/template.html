<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rhapsody of Love – Gallery</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

  <style>
    /* ✅ Clean white aesthetic */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
    }

    /* Subtle scrollbar styling */
    body::-webkit-scrollbar {
      width: 8px;
    }
    body::-webkit-scrollbar-thumb {
      background-color: #d1d5db;
      border-radius: 4px;
    }

    /* Modal always above everything */
    #gallery-modal {
      z-index: 9999;
    }

    /* Smooth image transition */
    img {
      transition: transform 0.5s ease, opacity 0.3s ease;
    }

    .swiper-slide img {
      max-height: 80vh;
      object-fit: contain;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- Header -->
  <header class="relative text-center pt-20 pb-16 sm:pb-24 bg-white overflow-hidden">
    <h1 class="text-5xl sm:text-6xl md:text-7xl font-extrabold mb-4 
               bg-gradient-to-r from-gray-800 via-pink-500 to-gray-800 
               bg-clip-text text-transparent tracking-tight leading-snug">
      Wedding Gallery
    </h1>

    <div class="mx-auto w-20 h-1 bg-gradient-to-r from-gray-800 to-pink-400 rounded-full mb-6"></div>

    <p class="text-lg sm:text-xl text-gray-500 max-w-2xl mx-auto px-4">
      A curated collection of timeless love stories captured through our lens.
    </p>
  </header>

  <!-- Gallery Section -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
    <div id="gallery-grid"
         class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
    </div>
  </section>

  <!-- Modal (Lightbox with Swiper) -->
  <div id="gallery-modal"
       class="fixed inset-0 bg-white/95 backdrop-blur-md hidden transition-opacity duration-300 flex items-center justify-center"
       onclick="closeModal(event)">

    <button id="close-modal-btn"
            class="absolute top-4 right-4 text-3xl font-light text-gray-700 hover:text-pink-500 z-50"
            onclick="closeModal()">
      &times;
    </button>

    <div class="h-full w-full max-w-6xl mx-auto p-4 sm:p-12">
      <div class="swiper-container w-full h-full">
        <div id="swiper-wrapper" class="swiper-wrapper"></div>

        <div class="swiper-button-next text-gray-700 hover:text-pink-500 transition-colors"></div>
        <div class="swiper-button-prev text-gray-700 hover:text-pink-500 transition-colors"></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

  <script>
    // -------------------------------
    // 1. Image Data Array
    // -------------------------------
    const images = [
      { id: 1, url: 'https://images.unsplash.com/photo-1604514628550-37477afdf4e3?auto=format&fit=crop&w=1200&q=80', alt: 'Couple Portrait', heightClass: 'h-96' },
      { id: 2, url: 'https://images.unsplash.com/photo-1529634893914-2a7d04bde586?auto=format&fit=crop&w=1200&q=80', alt: 'Ceremony Shot', heightClass: 'h-72' },
      { id: 3, url: 'https://images.unsplash.com/photo-1530023367847-a683933f4172?auto=format&fit=crop&w=1200&q=80', alt: 'Detail Shot', heightClass: 'h-[28rem]' },
      { id: 4, url: 'https://images.unsplash.com/photo-1602511802745-9fe1d8fd35c0?auto=format&fit=crop&w=1200&q=80', alt: 'Reception Venue', heightClass: 'h-80' },
      { id: 5, url: 'https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=1200&q=80', alt: 'First Dance', heightClass: 'h-96' },
      { id: 6, url: 'https://images.unsplash.com/photo-1508973374600-733b07f3d734?auto=format&fit=crop&w=1200&q=80', alt: 'Candid Moment', heightClass: 'h-72' },
      { id: 7, url: 'https://images.unsplash.com/photo-1601924738208-6e9f34f7ab98?auto=format&fit=crop&w=1200&q=80', alt: 'Sunset Photo', heightClass: 'h-[28rem]' },
      { id: 8, url: 'https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=1200&q=80', alt: 'Rings Detail', heightClass: 'h-80' },
    ];

    const galleryGrid = document.getElementById('gallery-grid');
    const swiperWrapper = document.getElementById('swiper-wrapper');
    const galleryModal = document.getElementById('gallery-modal');
    let swiperInstance = null;

    // -------------------------------
    // 2. Render Gallery
    // -------------------------------
    function renderGallery() {
      images.forEach((img, index) => {
        const gridItem = document.createElement('div');
        gridItem.className =
          'overflow-hidden rounded-xl shadow-lg bg-white hover:shadow-xl cursor-pointer transform hover:scale-[1.02] transition duration-300 group';

        gridItem.innerHTML = `
          <img src="${img.url}" alt="${img.alt}" data-index="${index}"
               class="w-full ${img.heightClass} object-cover transition-opacity duration-500 group-hover:opacity-90"
               loading="lazy"
               onclick="openModal(${index})">
        `;
        galleryGrid.appendChild(gridItem);

        const swiperSlide = document.createElement('div');
        swiperSlide.className = 'swiper-slide flex justify-center items-center';
        swiperSlide.innerHTML = `
          <img src="${img.url}" alt="${img.alt}" class="max-w-full max-h-full object-contain" loading="lazy">
        `;
        swiperWrapper.appendChild(swiperSlide);
      });
    }

    // -------------------------------
    // 3. Modal Logic
    // -------------------------------
    function openModal(startIndex) {
      galleryModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      if (!swiperInstance) {
        swiperInstance = new Swiper('.swiper-container', {
          initialSlide: startIndex,
          loop: true,
          speed: 500,
          navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
          },
          pagination: {
            el: '.swiper-pagination',
            clickable: true,
          },
        });
      } else {
        swiperInstance.slideToLoop(startIndex, 0);
      }
    }

    function closeModal(e) {
      if (e && e.target.id !== 'gallery-modal') return;
      galleryModal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    document.addEventListener('DOMContentLoaded', renderGallery);
  </script>
</body>
</html>
